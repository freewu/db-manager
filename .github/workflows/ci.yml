name: CI

# The safety net behind the "commit and push when a task is done" rule in
# AGENTS.md. Tag pushes are deliberately excluded — `.github/workflows/release.yml`
# owns those (a `branches` filter means tag refs never match here).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      # The SQLite driver is pure Go (modernc.org/sqlite), so no cgo or service
      # containers are needed here.
      - run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `npm run build` is `tsc --noEmit && vite build`, so this also type checks.
      - run: npm run build
        working-directory: frontend

      # A translation can lose a `{placeholder}` or a `|` plural form without
      # failing the type checker — the message just reads wrong at runtime.
      - name: Translations match their English source
        run: node scripts/i18n.mjs verify

  housekeeping:
    name: Housekeeping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Version mirrors agree with wails.json
        run: node scripts/version.mjs --check

      - name: Brand assets are in sync
        run: |
          cmp asserts/logo.png build/appicon.png
          cmp asserts/logo.png frontend/public/logo.png

      # The introduction page in docs/ is plain HTML, so nothing compiles it.
      # This is what notices a language that lost a key, a screenshot that was
      # renamed, or a relative path that no longer resolves.
      - name: Introduction site is consistent
        run: node scripts/docs-check.mjs
