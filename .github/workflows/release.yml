name: Release

# Releases are tag driven:
#
#   just publish 0.2.0 "一句话总结本版内容"
#
# That syncs the version into wails.json / Justfile / frontend/package.json /
# app.go, commits, and pushes both the commit and the `v0.2.0` tag. The tag push
# is what runs this workflow: it verifies the tree, builds the standalone
# executables for Windows, macOS and Linux, then publishes the GitHub Release
# (notes are rendered by scripts/release-notes.sh).
#
# `workflow_dispatch` runs the same matrix without publishing anything, which is
# how you smoke test a change to this file.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  WAILS_VERSION: 'v2.16.0'

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version mirrors agree with wails.json
        run: node scripts/version.mjs --check

      # Guards against tagging a version that was never written into the tree,
      # which would ship a binary whose `main.Version` disagrees with the tag.
      - name: Tag matches wails.json
        if: github.ref_type == 'tag'
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"

      # `asserts/` is the single source of truth for the brand artwork;
      # `just icons` refreshes the copies that the build consumes.
      - name: Brand assets are in sync
        run: |
          cmp asserts/logo.png build/appicon.png
          cmp asserts/logo.png frontend/public/logo.png

      - run: go vet ./...
      - run: go test ./...

      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            built: db-manager.exe
            suffix: windows-amd64.exe
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            built: db-manager.app
            suffix: macos-universal.zip
          - name: linux-amd64
            os: ubuntu-22.04
            platform: linux/amd64
            built: db-manager
            suffix: linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` in the notes script wants the tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails links against GTK3 + WebKitGTK on Linux. Pinned to 22.04 on
      # purpose: it ships WebKitGTK 4.0, which every current distribution has,
      # whereas 24.04 only has 4.1 and would need `-tags webkit2_41` plus a much
      # narrower set of machines that can run the result.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./wails.json').info.productVersion")
          fi
          echo "value=${version}" >>"$GITHUB_OUTPUT"
          echo "Building ${version} for ${{ matrix.platform }}"

      # `-clean` wipes build/bin so a reused runner cannot ship a stale binary.
      # `-ldflags` is what makes the compiled binary report the release version.
      - name: Build
        shell: bash
        run: |
          wails build -clean -platform ${{ matrix.platform }} \
            -ldflags "-X main.Version=${{ steps.version.outputs.value }}"

      # The asset name is what a user reads in the release list, so it names the
      # platform and the version — the same shape `scripts/package.mjs` gives a
      # local build. Windows and Linux ship the bare executable (the frontend
      # bundle is embedded, so the file is standalone); a .app is a directory,
      # so macOS gets a zip, which keeps the bundle layout and the executable
      # bit intact.
      - name: Name the artefact after the platform
        shell: bash
        run: |
          asset="db-manager-${{ steps.version.outputs.value }}-${{ matrix.suffix }}"
          mkdir -p build/dist
          if [ "${{ matrix.built }}" = "db-manager.app" ]; then
            (cd build/bin && zip -qry "../dist/${asset}" db-manager.app)
          else
            mv "build/bin/${{ matrix.built }}" "build/dist/${asset}"
          fi
          ls -lh build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `actions/checkout` records the tag as a lightweight ref pointing at the
      # commit, because for a tag push `github.sha` is the commit the tag points
      # to. `%(contents)` of a lightweight ref is the *commit* message, so the
      # hand written release summary would silently become the last commit body.
      # Fetch the real annotated tag object before rendering the notes.
      - name: Fetch the annotated tag
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git cat-file -t "refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A matrix leg that quietly produced nothing would otherwise turn into a
      # release with a missing or empty download, so count and weigh them
      # before publishing. Every real build is well over 20 MB.
      - name: All three platforms arrived
        working-directory: dist
        run: |
          ls -lh
          test "$(ls db-manager-* | wc -l)" -eq 3
          for file in db-manager-*; do
            bytes=$(stat -c%s "$file")
            echo "${file}: ${bytes} bytes"
            test "$bytes" -gt 5000000
          done

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum db-manager-* >checksums.txt
          cat checksums.txt

      - name: Generate the release notes
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" >RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # Re-running a failed release must not trip over the existing release,
      # hence the `gh release edit` / `--clobber` branch.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/db-manager-*
            dist/checksums.txt
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "DB Manager ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "DB Manager ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              "${assets[@]}"
          fi
