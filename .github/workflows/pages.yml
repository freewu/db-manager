name: Pages

# Publish the introduction page in docs/ as the project site:
#
#   https://freewu.github.io/db-manager/
#
# The page is plain HTML with no build step, and it owns everything it shows:
# the engine marks live in docs/engine/ and the version it prints in
# docs/version.json. So what gets published is `docs/` exactly as committed —
# which is also why the same directory works when it is opened from a checkout.
#
# A workflow is not what makes it work: with Settings → Pages → Source set to
# "Deploy from a branch" and the folder set to `/docs`, GitHub builds and serves
# the directory on every push to it. This workflow is the other source "GitHub
# Actions", publishing the same bytes; keep the two from disagreeing by never
# publishing anything that is not in `docs/`. Enabling it once: Settings → Pages
# → Build and deployment → Source: "GitHub Actions". Nothing here can do it for
# the repository — the `configure-pages` action needs a token other than
# GITHUB_TOKEN for that — so until it is switched on, the build job stops at
# that step.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'asserts/**'
      - 'wails.json'
      - 'scripts/version.mjs'
      - 'scripts/docs-check.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments run one after another rather than cancelling each other: a deploy
# that is interrupted halfway is worse than a slightly stale page, and the run
# that follows replaces it a few seconds later anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Fail before publishing rather than after: a language that lost a key, a
      # screenshot that was renamed, or a reference that escapes docs/ should
      # never reach the site.
      - name: The site is consistent
        run: node scripts/docs-check.mjs

      - uses: actions/configure-pages@v5

      # The versions are the ones GitHub's own Pages template pins. Note that
      # this action drops dotfiles, so nothing here may rely on a `.nojekyll`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
